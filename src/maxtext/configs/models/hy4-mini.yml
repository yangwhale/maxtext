# Hy4-mini: a ~0.43B random-init Hy4 for end-to-end GPU / TPU numerical alignment.
# Everything as hy4-preview (structure, per-head dims, real vocabulary, checkpoint reading, precision settings) except
# width 1024, 8 heads, q_lora 512, dense FFN 3072, 16 routed experts (top-4, divisible by EP 4) of width 256, and
# 7 layers: 1 dense + 6 MoE (one IndexCache group of 4 and a remainder of 2), plus 1 MTP layer.
# Parameters 427,783,489 incl. MTP (401,841,193 without; embedding + output head 247,463,936), counted from the HF
# tensor shapes (janus models/hunyuan4/model/make_tiny_hf.py). The same count gives 769.91B for hy4-preview without
# MTP, matching the published 770B total (MTP layer: 10.05B more).
base_emb_dim: 1024
base_mlp_dim: 3072
base_moe_mlp_dim: 256
base_num_decoder_layers: 7
base_num_query_heads: 8
base_num_kv_heads: 8
vocab_size: 120832
q_lora_rank: 512
kv_lora_rank: 512
qk_nope_head_dim: 192
qk_rope_head_dim: 64
v_head_dim: 256
rope_max_timescale: 10000000
max_position_embeddings: 1048576
original_max_position_embeddings: 1048576
routed_weight_normalize: true
logits_dot_in_fp32: true # HF enable_lm_head_fp32
# DSA with IndexCache: the dense layer and the first MoE layer of each group of 4 run an indexer, the other 3
# reuse its top-k (HF indexer_types). indexer_sparse_training: the main model trains through the sparse top-k
# attention (with it off, MaxText's dense warm-up stage skips the main loss). How the indexer itself is trained
# (indexer_loss_scaling_factor, warm-up) is a recipe choice HF does not publish; 0 leaves the indexer untrained.
use_indexer: true
indexer_sparse_training: true
indexer_loss_scaling_factor: 0.0
indexer_share_interval: 4
indexer_n_heads: 32
indexer_head_dim: 128
indexer_topk: 2048
indexer_rope_position: "last" # HF HYV4Indexer: RoPE on the last qk_rope_head_dim dims
# The released checkpoint stores indexer q_pe / k_pe in interleaved (GPT-J, pairs 2i / 2i+1) layout, and the
# serving stacks use k_norm eps 1e-6 (vLLM 8b55f919 vllm/models/hy_v4/nvidia/attention.py L176, L443
# is_neox_style=False).
# HF modeling_hy_v4.py (transformers v5.22.1) uses half-split RoPE and rms_norm_eps (1e-5) here instead.
# checkpoint_rope_interleave (below) de-interleaves the indexer wq_b / wk rope columns and k_norm rope entries at
# conversion, so the indexer runs concatenated RoPE.
indexer_k_norm_epsilon: 1.0e-6
indexer_rope_interleave: false
# The sparse indexer runs with dot_product or with flash through tokamax splash; flash on TPU needs this.
use_tokamax_splash: true

# ---- shared by every Hy4 size ----
decoder_block: "deepseek"
attention_type: "mla"
enable_dropout: false
logits_via_embedding: false
normalization_layer_epsilon: 1.0e-5
# q / kv latent norms: the serving stacks pass rms_norm_eps (1e-5) (vLLM attention.py L410); HF builds them
# without eps, i.e. the class default 1e-6.
mla_lora_norm_epsilon: 1.0e-5
# Gated MLA: out *= sigmoid(gate_proj(x)) per head and value channel; one learned sink logit per head.
attention_output_gate: "elementwise"
attention_sink: true
# Hy4 RoPE is plain RoPE. YaRN with rope_factor=1 and
# max_position_embeddings == original_max_position_embeddings reproduces it exactly
# (no frequency interpolation, no mscale on the softmax scale).
# The released checkpoint stores MLA q_pe / k_pe interleaved (pairs 2i / 2i+1; vLLM attention.py L429
# is_neox_style=False, L434-438). HF -> MaxText conversion de-interleaves the wq_b / wkv_a rope columns
# (checkpoint_rope_interleave), so the model runs concatenated RoPE: the same function as interleaved RoPE on the
# checkpoint, and on v7x the interleaved path is slower and uses more HBM in training.
# Nothing in a MaxText checkpoint records the rope column layout, so loading an older one with these settings does
# not fail; it silently computes wrong RoPE. Older MaxText checkpoints load as before only with these overrides
# (plus override_model_config=true):
# - converted from the HF release, or trained from scratch, with the interleaved-RoPE settings: re-convert the HF ones, or
#   rope_interleave=true indexer_rope_interleave=true checkpoint_rope_interleave=false;
# - trained from scratch with the original transformers-reading settings: rope_interleave=false indexer_rope_interleave=false
#   checkpoint_rope_interleave=false mla_lora_norm_epsilon=1.0e-6 indexer_k_norm_epsilon=1.0e-5.
rope_type: "yarn"
rope_factor: 1
rope_interleave: false
checkpoint_rope_interleave: true
rope_attention_scaling: false
# Identity hyper-connections over 4 streams, collapsed by a learned HC head before the final norm.
mhc_expansion_rate: 4
hc_variant: "ihc"
hc_post_magnitude: 2.0
hc_eps: 1.0e-6
hc_init_std: 0.006
use_hc_head: true
hc_head_norm_epsilon: 1.0e-5
hc_head_base_init: -1.0986122886681098 # -log(mhc_expansion_rate - 1), HF HYV4HyperHead init
init_weights_std: 0.006 # HF initializer_range
mtp_num_layers: 1 # HF num_nextn_predict_layers
mtp_loss_scaling_factor: 0.1 # HF mtp_loss_factor
mtp_input_post_final_norm: true
# MoE: first layer dense, then 16 routed experts (top-4, sigmoid scores, bias only selects) + 1 shared.
first_num_dense_layers: 1
num_experts: 16
num_experts_per_tok: 4
shared_experts: 1
mlp_activations: ["silu", "linear"]
mlp_activations_limit: 10.0
# Match torch.clamp at the exact bound (the reference implementations use clamp).
mlp_activations_limit_inclusive_grad: true
routed_score_func: "sigmoid"
routed_bias: true
routed_scaling_factor: 2.827
n_routing_groups: -1
topk_routing_group: -1
# Precision kept in float32 on TPU: the router projection and the
# hyper-connection gate projections run at highest matmul precision; MoE routing indices are saved, not recomputed,
# when remat is on. Training throughput work must not relax these.
float32_gate_logits: true
router_matmul_precision: "highest"
hc_matmul_precision: "highest"
moe_routing_maps: "device"
# Loss-free load balancing. HF does not publish the update rate; 0.001 is the DeepSeek-V3 value (inferred).
routed_bias_update_rate: 0.001
