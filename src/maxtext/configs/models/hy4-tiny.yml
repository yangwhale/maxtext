# Small Hy4 for conversion and unit tests: the hy4-preview layout and settings at small sizes, including the checkpoint
# reading: like vLLM / SGLang (q_pe / k_pe stored interleaved, latent norm eps 1e-5, indexer k_norm eps 1e-6),
# de-interleaving q_pe / k_pe at conversion (checkpoint_rope_interleave) and running concatenated RoPE. The HF
# transformers modeling_hy_v4 (v5.22.1) reading (half-split RoPE, eps 1e-6 / 1e-5) is no longer used by any Hy4 size
# (2026-11-07: one reading everywhere).
# 1 dense + 6 MoE layers = one IndexCache group of 4 and a remainder of 2.
base_emb_dim: 256
base_mlp_dim: 512
base_moe_mlp_dim: 64
base_num_decoder_layers: 7
base_num_query_heads: 4
base_num_kv_heads: 4
vocab_size: 1024
q_lora_rank: 64
kv_lora_rank: 32
qk_nope_head_dim: 32
qk_rope_head_dim: 16
v_head_dim: 32
rope_max_timescale: 10000000
max_position_embeddings: 1048576
original_max_position_embeddings: 1048576
routed_weight_normalize: true
logits_dot_in_fp32: true # HF enable_lm_head_fp32
# DSA with IndexCache on (indexer_topk 16 is shorter than the test sequences, so the top-k selection is exercised).
use_indexer: true
indexer_sparse_training: true
indexer_share_interval: 4
indexer_n_heads: 16
indexer_head_dim: 32
indexer_topk: 16
indexer_rope_position: "last" # HF HYV4Indexer: RoPE on the last qk_rope_head_dim dims
indexer_k_norm_epsilon: 1.0e-6 # serving stacks (vLLM), as hy4-preview
indexer_rope_interleave: false # de-interleaved at conversion (checkpoint_rope_interleave), as hy4-preview
# The sparse indexer runs with dot_product or with flash through tokamax splash; flash on TPU needs this.
use_tokamax_splash: true

# ---- shared by every Hy4 size ----
decoder_block: "deepseek"
attention_type: "mla"
enable_dropout: false
logits_via_embedding: false
normalization_layer_epsilon: 1.0e-5
# q / kv latent norms: rms_norm_eps (1e-5), as the serving stacks and hy4-preview.
mla_lora_norm_epsilon: 1.0e-5
# Gated MLA: out *= sigmoid(gate_proj(x)) per head and value channel; one learned sink logit per head.
attention_output_gate: "elementwise"
attention_sink: true
# Plain RoPE on the de-interleaved columns, as hy4-preview. YaRN with rope_factor=1 and
# max_position_embeddings == original_max_position_embeddings reproduces it exactly
# (no frequency interpolation, no mscale on the softmax scale).
rope_type: "yarn"
rope_factor: 1
rope_interleave: false
checkpoint_rope_interleave: true
rope_attention_scaling: false
# Identity hyper-connections over 4 streams, collapsed by a learned HC head before the final norm.
mhc_expansion_rate: 4
hc_variant: "ihc"
hc_post_magnitude: 2.0
hc_eps: 1.0e-6
hc_init_std: 0.006
use_hc_head: true
hc_head_norm_epsilon: 1.0e-5
hc_head_base_init: -1.0986122886681098 # -log(mhc_expansion_rate - 1), HF HYV4HyperHead init
init_weights_std: 0.006 # HF initializer_range
mtp_num_layers: 1
mtp_loss_scaling_factor: 0.1 # HF mtp_loss_factor
mtp_input_post_final_norm: true
# MoE: first layer dense, then 8 routed experts (top-2, sigmoid scores, bias only selects) + 1 shared.
first_num_dense_layers: 1
num_experts: 8
num_experts_per_tok: 2
shared_experts: 1
mlp_activations: ["silu", "linear"]
mlp_activations_limit: 10.0
# Match torch.clamp at the exact bound (the reference implementations use clamp).
mlp_activations_limit_inclusive_grad: true
routed_score_func: "sigmoid"
routed_bias: true
routed_scaling_factor: 2.827
n_routing_groups: -1
topk_routing_group: -1
# Precision kept in float32 on TPU: the router projection and the
# hyper-connection gate projections run at highest matmul precision; MoE routing indices are saved, not recomputed,
# when remat is on. Training throughput work must not relax these.
float32_gate_logits: true
router_matmul_precision: "highest"
hc_matmul_precision: "highest"
moe_routing_maps: "device"
# Loss-free load balancing. HF does not publish the update rate; 0.001 is the DeepSeek-V3 value (inferred).
routed_bias_update_rate: 0.001
